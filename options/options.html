<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設定 - Twitter/X Tweet Saver</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">設定</h1>
    </header>

    <div class="section">
      <h2 class="section-title">最大保存件数</h2>
      <p class="description">タイムラインで保存するツイートの最大件数を設定します。</p>
      <div class="setting-row">
        <label class="setting-label" for="maxItems">
          最大件数:
        </label>
        <input type="number" id="maxItems" min="20" max="2000" class="setting-input">
        <span class="range-hint">(20 - 2000)</span>
      </div>
      <button id="saveBtn" class="save-btn">保存する</button>
      <span id="saveMessage" class="save-message"></span>
    </div>

    <div class="section">
      <h2 class="section-title">データ管理</h2>
      <p class="description">保存されたツイートデータを管理します。</p>
      <button id="deleteAllBtn" class="delete-btn">すべて削除</button>
    </div>

    <div class="section">
      <h2 class="section-title">拡張機能について</h2>
      <div class="info-box">
        <p><strong>バージョン:</strong> <span id="version"></span></p>
        <p><strong>保存場所:</strong> ローカルストレージ (chrome.storage.local)</p>
        <p><strong>データの送信:</strong> 一切行われません</p>
      </div>
    </div>

    <div class="support-section">
      <a href="https://www.paypal.com/paypalme/hinosi" target="_blank" rel="noopener noreferrer">
        <button class="support-btn">開発者を支援</button>
      </a>
    </div>
  </div>

  <script src="../src/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
